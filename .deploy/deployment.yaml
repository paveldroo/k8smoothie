apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: gracefulapp
  annotations:
    meta.helm.sh/release-name: gracefulapp
    meta.helm.sh/release-namespace: default
  name: gracefulapp
  namespace: default
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 0
  selector:
    matchLabels:
      app: gracefulapp
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: gracefulapp
        version: "1.27"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - image: gracefulapp:latest
        name: gracefulapp
        resources: {}
        imagePullPolicy: Never
status: {}
